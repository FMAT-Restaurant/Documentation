site_name: FMAT Restaurant · Contratos
site_description: Contratos y flujos operacionales de FMAT Restaurant.
theme:
  name: material
  language: es
  features:
    - navigation.sections
    - navigation.top
    - search.highlight
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Cambiar a modo oscuro
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Cambiar a modo claro
nav:
  - Inicio: index.md
  - Contratos:
      - Eventos de dominio e integración: contracts/domain-events.md
      - Contrato AsyncAPI: contracts/asyncapi.md
markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - tables
plugins:
  - search
extra_javascript:
  - javascripts/mermaid.js
use_directory_urls: true
