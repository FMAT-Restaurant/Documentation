name: Publicar documentación y EventCatalog

on:
  push:
    branches:
      - main
    paths:
      - "docs/**"
      - "eventcatalog/**"
      - "mkdocs.yml"
      - "package.json"
      - "package-lock.json"
      - "requirements.txt"
      - "scripts/**"
      - ".github/workflows/publish-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Obtener el repositorio
        uses: actions/checkout@v7

      - name: Configurar Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Configurar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Configurar Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias Node.js
        run: npm ci

      - name: Validar el contrato AsyncAPI
        run: npm run lint:asyncapi

      - name: Generar recursos de EventCatalog desde AsyncAPI
        run: npm run eventcatalog:generate

      - name: Limpiar compilación previa de EventCatalog
        run: npm run eventcatalog:clean

      - name: Construir EventCatalog estático
        run: npm run eventcatalog:build
        env:
          ASTRO_TELEMETRY_DISABLED: "1"
          EVENTCATALOG_BASE: ${{ steps.pages.outputs.base_path }}/eventcatalog/

      - name: Instalar MkDocs Material
        run: python -m pip install -r requirements.txt

      - name: Construir documentación Markdown
        env:
          NO_MKDOCS_2_WARNING: "1"
        run: python -m mkdocs build --strict --site-dir site/markdown

      - name: Ensamblar el artefacto único de Pages
        run: npm run docs:assemble

      - name: Publicar el artefacto de Pages
        uses: actions/upload-pages-artifact@v5
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Desplegar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
